server:
  port: 8054

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    # noinspection SpringBootApplicationYaml
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  # 数据源配置项
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource # 指定使用的 DBCP 连接池类
    driver-class-name: com.mysql.cj.jdbc.Driver
    dbcp2:
      driver-class-name: ${spring.datasource.driver-class-name}
      # url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&autoReconnect=true&failOverReadOnly=false
      url: jdbc:mysql://localhost:3306/test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true # MySQL Connector/J 8.X 连接的示例
      initial-size: 1  # 初始连接数
      min-idle: 1 # 最小连接池数量
      max-active: 30 # 最大连接池数量
      max-idle: 30
      max-wait: -1 # 配置获取连接等待超时的时间,单位:毫秒(1 分钟)
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      default-auto-commit: true
      pool-prepared-statements: true # 是否开启 PreparedStatement 缓存
      time-between-eviction-runs-millis: 60000  # 配置间隔多久才进行一次检测,检测需要关闭的空闲连接,单位:毫秒(1 分钟)
      min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间,单位:毫秒(10 分钟)
      max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间,单位:毫秒(30 分钟)
      validation-query: select 1
      connection-properties: useUnicode=true;characterEncoding=UTF8;rewriteBatchedStatements=true;socketTimeout=60000;autoReconnectForPools=true
    hikari:
      driver-class-name: ${spring.datasource.driver-class-name}
      # 连接池的名字:强烈建议配一个框架专属名,线上高并发发生死锁时,用 jstack 一眼就能抓到它
      pool-name: MbpProxyHikariPool
      # 最大活跃连接数(替代了原本旧版 DBCP 的 maxActive 参数)
      # 生产环境推荐 30~100 之间,根据你的数据库硬件承载力弹性调整
      maximum-pool-size: 50
      # 最小空闲连接数:常驻在池子里的保底连接.
      # 生产环境推荐与 maximum-pool-size 保持一致,能够彻底消灭突发瞬时洪峰时重新建连的性能损耗
      minimum-idle: 10
      # 获取连接的最大等待超时时间(毫秒).
      # 设置 30s(30000ms).如果在 30 秒内池子满了拿不到连接,主线程会安全抛错,绝对不会无限死等拖垮 Tomcat 线程池
      connection-timeout: 30000
      # 一个连接在池子里保持空闲状态的最大时长(毫秒).默认 10 分钟.
      # 空闲连接超过该时间且池内连接多于 minimum-idle 时,会被物理释放,防白白消耗服务器 socket 管道
      idle-timeout: 600000
      # 一个连接的绝对最长生命周期(毫秒).默认 30 分钟.
      # 必须比数据库服务端的 wait_timeout 短至少 30 秒!防止踩中"连接被数据库单方面闪断"的经典线上断连大坑
      max-lifetime: 1800000
      # 用来检测连接是否依然活着的测试 SQL 语句(高效的轻量级心跳)
      connection-test-query: SELECT 1
      # 是否自动提交事务,默认 true.交给 Spring 的 @Transactional 事务管理器自行接管即可
      is-auto-commit: true
      # ==================== 高级诊断防护(选填,线上排查必用) ====================
      # 连接泄露检测阈值(毫秒).默认 0 代表关闭.
      # 生产环境强烈建议设置为 20000(20秒).如果由于开发人员漏写 close 或事务长期不结束,
      # 导致一个连接被某段业务代码霸占超过 20 秒,Hikari 会在日志里直接把那个犯错类的堆栈打印出来,精准抓出内鬼!
      leak-detection-threshold: 20000
    druid: # Druid [监控]相关的全局配置
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow: # 设置白名单,不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid [连接池]相关的全局配置
        initial-size: 1 # 初始连接数
        min-idle: 1 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 60000 # 配置获取连接等待超时的时间,单位:毫秒(1 分钟)
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测,检测需要关闭的空闲连接,单位:毫秒(1 分钟)
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间,单位:毫秒(10 分钟)
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间,单位:毫秒(30 分钟)
        validation-query: SELECT 1 FROM DUAL # 配置检测连接是否有效
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true # 是否开启 PreparedStatement 缓存
        max-pool-prepared-statement-per-connection-size: 20 # 每个连接缓存的 PreparedStatement 数量
      primary: master
      datasource:
        master:
          url:  ${spring.datasource.dbcp2.url}
          username:  ${spring.datasource.username}
          password: ${spring.datasource.password}
        slave: # 模拟从库,可根据自己需要修改
          lazy: true # 开启懒加载,保证启动速度
          url:  ${spring.datasource.dbcp2.url}
          username:  ${spring.datasource.username}
          password: ${spring.datasource.password}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      connect-timeout: 3s
      timeout: 2s
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 5s
  #elasticsearch config
  elasticsearch:
    jest:
      uris:
      username:
      password:
      multi-threaded: true
      connection-timeout: 100
      read-timeout: 100
      proxy:
        host:
        port:
--- #################### 定时任务相关配置 ####################

# Quartz 配置项,对应 QuartzProperties 配置类
spring:
  quartz:
    auto-startup: true # 本地开发环境,尽量不要开启 Job
    scheduler-name: schedulerName # Scheduler 名字.默认为 schedulerName
    job-store-type: jdbc # Job 存储器类型.默认为 memory 表示内存,可选 jdbc 使用数据库.
    # 容器初始化后，延迟多少秒启动定时任务
    startup-delay: 5s
    # 冲突时是否覆盖已存在的 Job 定义
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true # 应用关闭时,是否等待定时任务执行完成.默认为 false ,建议设置为 true
    jdbc: # 使用 JDBC 的 JobStore 的时候,JDBC 的配置
      initialize-schema: NEVER # 是否自动使用 SQL 初始化 Quartz 表结构.这里设置成 never,我们手动创建表结构.
    properties: # 添加 Quartz Scheduler 附加属性,更多可以看 http://www.quartz-scheduler.org/documentation/2.4.0-SNAPSHOT/configuration.html 文档
      'applicationContextSchedulerContextKey': 'applicationContextKey'
      'autoStartup': 'true' #设置自动启动
      # 数据源相关(去除 org.quartz 前缀)
      'dataSource.driver': '${spring.datasource.dbcp2.driver-class-name}'
      'dataSource.url': '${spring.datasource.dbcp2.url}'
      'dataSource.username': '${spring.datasource.username}'
      'dataSource.password': '${spring.datasource.password}'
      'dataSource.minIdle': '${spring.datasource.dbcp2.min-idle}'
      'dataSource.maxActive': '${spring.datasource.dbcp2.max-active}' # 数据库最大连接数(如果Scheduler很忙,比如执行的任务与线程池的数量差不多相同,那就需要配置DataSource的连接数量为线程池数量+1)
      'dataSource.maxIdle': '${spring.datasource.dbcp2.max-idle}'
      'dataSource.maxWait': '${spring.datasource.dbcp2.max-wait}'
      'dataSource.testWhileIdle': '${spring.datasource.dbcp2.test-while-idle}'
      'dataSource.defaultAutoCommit': '${spring.datasource.dbcp2.default-auto-commit}'
      'dataSource.timeBetweenEvictionRunsMillis': '${spring.datasource.dbcp2.time-between-eviction-runs-millis}'
      'dataSource.minEvictableIdleTimeMillis': '${spring.datasource.dbcp2.min-evictable-idle-time-millis}'
      'dataSource.validationQuery': '${spring.datasource.dbcp2.validation-query}' # dataSource用于检测connection是否failed/corrupt的SQL语句
      'dataSource.connectionProperties': '${spring.datasource.dbcp2.connection-properties}'
      # JobStore 相关配置
      'jobStore.class': 'org.springframework.scheduling.quartz.LocalDataSourceJobStore'
      'jobStore.driverDelegateClass': 'org.quartz.impl.jdbcjobstore.StdJDBCDelegate'
      'jobStore.isClustered': 'false'  #是否集群模式
      'jobStore.clusterCheckinInterval': '15000' # 调度实例失效的检查时间间隔(集群检查频率),单位:毫秒.默认为 15000,即 15 秒
      'jobStore.misfireThreshold': '120000' # 容许的最大作业延 misfire 阀值,单位:毫秒.
      'jobStore.maxMisfiresToHandleAtATime': '1' # jobStore处理未按时触发的Job的数量
      'jobStore.tablePrefix': 'QRTZ_' #数据库表前缀
      'jobStore.useProperties': 'true'
      # Scheduler 相关配置
      'scheduler.instanceId': 'AUTO' # 自动生成 instance ID,设置为自动获取 每一个必须不同
      'scheduler.instanceName': 'ClusterScheduler' # 调度器实例名称
      #远程管理相关的配置,全部关闭
      'scheduler.rmi.export': 'false'
      'scheduler.rmi.proxy': 'false'
      'scheduler.wrapJobExecutionInUserTransaction': 'false'
      'schedulerName': 'ClusterScheduler'
      'startupDelay': '30'  #必须的,QuartzScheduler 延时启动,应用启动完后 QuartzScheduler 再启动
      # 线程池相关配置
      'threadPool.class': 'org.quartz.simpl.SimpleThreadPool' # 线程池类型
      # 核心并发线程数
      'threadPool.threadCount': '100' # 线程池大小.默认为 10 .
      'threadPool.threadPriority': '5' # 线程优先级
      'threadPool.threadsInheritContextClassLoaderOfInitializingThread': 'true' #自创建父线程

--- #################### 消息队列相关 ####################

# rocketmq 配置项,对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv

spring:
  data:
    # Kafka 配置项,对应 KafkaProperties 配置类
    kafka:
      # ==================== 1. 基础全局配置 ====================
      bootstrap-servers: localhost:9092 # Kafka 服务集群地址,多个用逗号隔开 (如: 192.168.1.1:9092,192.168.1.2:9092)
      # ==================== 2. 生产者配置 (Producer) ====================
      producer:
        # acks = 0: 生产者只管发,不管 Broker 是否收到.吞吐最高,最易丢数据.
        # acks = 1: 只要 Leader 分区确认收到就返回成功.折中方案.
        # acks = all / -1: Leader 和所有 Follower 副本都同步完才成功.最安全,绝对不丢消息.
        acks: 1
        retries: 3                  # 发送失败时自动重试 3 次,防止因网络瞬时抖动引发报错
        batch-size: 16384            # 批量发送的大小限制(默认 16KB).增大可提高吞吐,但会略微增加延迟
        buffer-memory: 33554432      # 生产者本地物理缓存区大小(默认 32MB),高并发时防止主线程发生阻塞
        key-serializer: org.apache.kafka.common.serialization.StringSerializer     # Key 序列化器
        value-serializer: org.apache.kafka.common.serialization.StringSerializer   # Value 序列化器
        properties:
          linger.ms: 10              # 发送延迟等待.设置 10ms,让生产者等 10 毫秒攒够一个 batch 一起发,大幅降低网络 I/O 压力率
      # ==================== 3. 消费者配置 (Consumer) ====================
      consumer:
        group-id: demo-group # 默认的消费者组 ID(业务项目中通常会被 @KafkaListener(groupId = "xxx") 覆盖)
        # earliest: 当各分区没有历史提交的偏移量(offset)时,从最早的记录开始消费
        # latest: 从最新的记录开始消费(默认值)
        auto-offset-reset: latest
        # 核心调优:关闭自动提交.自动提交(true)极易在程序发生异常崩溃或重启时导致"消息丢失"或"重复消费"
        enable-auto-commit: false
        max-poll-records: 500        # 单次拉取消息的最大条数.配合业务处理能力调整,防止单次拉取过多导致消费超时,触发死信队列或引发 OOM
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer # Key 反 serialization 器
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer # Value 反 serialization 器
        properties:
          session.timeout.ms: 15000  # 心跳超时时间.如果在 15 秒内 Broker 没收到消费者心跳,则认为该消费者挂了,触发 Rebalance(再均衡)
          max.poll.interval.ms: 300000 # 两次 poll 消息的最大时间间隔(默认 5 分钟).如果单次业务处理超过 5 分钟,Kafka 认为该消费者卡死,将其踢出组
      # ==================== 4. 监听器容器配置 (Listener) ====================
      listener:
        # RECORD: 每处理完一条记录就提交一次 offset
        # BATCH: 每次 poll 拉取的一批消息处理完毕后,提交一次 offset
        # MANUAL_IMMEDIATE: 手动调用 Acknowledgment.acknowledge() 后,立刻进行同步提交(💡 推荐:业务精准掌控)
        ack-mode: manual_immediate
        concurrency: 1               # 消费监听器的并发容器线程数.推荐将其设置为当前 Topic 分区数(Partition)的相同值,可以实现最大化的并行消费,压榨 CPU 性能
        missing-topics-fatal: false  # 启动项目时,如果发现配置的 Topic 在 Kafka 服务端不存在,是否报错阻断系统启动.设为 false 防止由于运维没建 Topic 导致系统直接崩溃崩溃
      # ==================== 5. 管理端配置 (Admin) ====================
      admin:
        fail-fast: false             # 启动时若连接不上 Kafka 集群,是否立刻终止整个 Spring 项目启动,推荐设为 false
      template:
        default-topic:
          send_topic: test
          receiver_topic: test
          send_topic_demo: test_demo
          receiver_topic_demo: test_demo
    # RabbitMQ 配置项,对应 RabbitProperties 配置类
    rabbitmq:
      # ==================== 1. 基础连接配置 ====================
      host: 127.0.0.1               # RabbitMQ 服务器地址(集群模式下建议使用下方的 addresses 属性)
      port: 5672                    # RabbitMQ 监听端口
      username: rabbit               # 登录用户名
      password: rabbit               # 登录密码
      virtual-host: /               # 虚拟主机隔离,默认是 /
      # addresses: 10.0.0.1:5672,10.0.0.2:5672  # 集群模式:如果配置了 addresses,会覆盖 host 和 port
      # ==================== 2. 连接池精细化调优 (Connection) ====================
      connection-timeout: 3s        # 与 RabbitMQ 建立物理连接的超时时间,支持 Spring 3.x 的 Duration 格式
      requested-heartbeat: 60s      # 物理网络心跳间隔.防止高并发下因网络静默导致连接被防火墙单方面闪断
      cache:
        channel:
          size: 50                  # 每个连接中常驻缓存的信道(Channel)数量.高并发下频繁创建/销毁信道非常消耗性能,配 50~100 可大幅提升吞吐量
          checkout-timeout: 3s      # 当信道缓存满时,换取新信道的最大等待超时时间
        connection:
          mode: channel             # 缓存模式:channel(单一连接复用多信道,推荐) 或 connection(多连接模式)
      # ==================== 3. 生产者高可靠配置 (Producer) ====================
      producer:
        # none: 关闭确认机制
        # correlated: 开启关联确认机制(发出去的消息不论成功还是失败,都会触发 RabbitTemplate.ConfirmCallback 回调,防丢消息)
        publisher-confirm-type: correlated
        publisher-returns: true     # 开启投递失败退回机制.当消息成功抵达 Broker 但找不到匹配的队列(Queue)时,会将消息退回给生产者,触发 ReturnCallback
      # ==================== 4. 消费者高可靠配置 (Consumer) ====================
      listener:
        simple:
          # none: 自动签收(性能最高,但只要消费者拉取到消息,不管业务是否执行成功都会从 MQ 物理抹除,极易丢消息)
          # auto: 由 Spring 根据业务是否抛出异常来自动决定提交还是回滚
          # manual: 手动签收(业务完全成功后手工调用 channel.basicAck() 签收,100% 防丢)
          acknowledge-mode: manual
          concurrency: 5            # 初始消费者并发线程数.根据 CPU 和业务吞吐弹性调整
          max-concurrency: 10       # 最大并发消费者线程数
          prefetch: 250             # 限流拉取条数(预取数量).限制每个信道一次性最多能积压多少条未 Ack 的消息,防止突发洪峰瞬间把消费者内存压爆(OOM)
          missing-queues-fatal: false # 启动项目时,如果发现监听的队列在 MQ 服务端不存在,是否报错阻断系统启动.设为 false 防止由于运维没建队列导致系统崩溃
          # 消费端内部的错误自动重试机制(仅对 auto 签收或未跑出致命异常时有效)
          retry:
            enabled: true           # 开启消费端内部自动重试
            max-attempts: 3         # 最大重试次数(默认 3 次)
            initial-interval: 1s    # 第一次重试的等待时间间隔
            max-interval: 10s       # 重试的最大最大时间间隔上限
            multiplier: 2.0         # 指数退避系数:下一次重试时间是上一次的 2 倍(1s -> 2s -> 4s -> 8s),防止雪崩效应压垮下游脆弱系统
      # ==================== 5. 消息模板通用配置 (Template) ====================
      template:
        retry:
          enabled: true             # 开启生产者发送失败时的内部自动重试
          max-attempts: 3           # 发送重试 3 次(防网络瞬时抖动)
          initial-interval: 1s
        # mandatory: true           # 配合上面的 publisher-returns 使用.设为 true 代表当消息无法路由到队列时,强制通过 ReturnCallback 退回给生产者

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录.默认为 /actuator
      exposure:
        include: '*' # 需要开放的端点.默认值只打开 health 和 info 两个端点.通过设置 * ,可以开放所有端点.

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      # Spring Boot Admin Client 客户端的相关配置
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path} # 设置 Spring Boot Admin Server 地址
        instance:
          service-host-type: IP # 注册实例时,优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
        username: admin
        password: admin
      # Spring Boot Admin Server 服务端的相关配置
      context-path: /admin # 配置 Spring
      # 允许嵌入 iframe 的域名(支持通配符),实际部署时,可以改为 "'self' [你的公网域名]"
      frame-ancestors: "'self' localhost localhost:8054 127.0.0.1 127.0.0.1:8054"

# 日志文件配置
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名,全路径
  #pattern:
    #console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger - %msg%n"
  level:
    # 配置自己写的 MyBatis Mapper 打印日志
    org.springframework: info
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 先禁用,Spring Boot 3.X 存在部分错误的 WARN 提示
    # io.netty.resolver.dns.macos.MacOSDnsServerAddressStreamProviders: OFF

debug: false

--- #################### 插件和MBP相关配置 ####################

org:
  apache:
    zookeeper:
      host: localhost
    hadoop:
